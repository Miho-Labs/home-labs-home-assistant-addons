name: Home Labs Sync
version: 0.2.2
slug: home_labs_sync
description: Synchronizacja dashboardów, motywu, automatyzacji, scen i zdjęć wygaszacza Home Labs oraz eksport encji
url: https://github.com/Miho-Labs/home-labs-home-assistant-addons
arch: [aarch64, amd64]
image: ghcr.io/miho-labs/home-labs-sync-{arch}
init: false
startup: application
boot: auto
homeassistant_api: true
hassio_api: true
hassio_role: homeassistant
map:
  - type: homeassistant_config
    read_only: false
  - type: media
    read_only: false
ingress: true
ingress_port: 8099
panel_icon: mdi:cloud-sync
panel_title: Home Labs Sync
panel_admin: true
options:
  api_url: https://public.home-labs.pl
  api_token: ""
  interval_minutes: 30
  scopes: [dashboards, themes, automations, scenes, media]
  restart_policy: auto
  restart_window: "02:00-05:00"
  entities_export_schedule: "off"
  entities_export_hour: 4
  dry_run: false
  log_level: info
schema:
  api_url: url
  api_token: password
  interval_minutes: int(5,1440)
  scopes: [list(dashboards|themes|automations|scenes|media)]
  restart_policy: list(never|notify|auto)
  restart_window: match(^\d\d:\d\d-\d\d:\d\d$)
  entities_export_schedule: list(off|daily|weekly)
  entities_export_hour: int(0,23)
  dry_run: bool
  log_level: list(debug|info|warning)
